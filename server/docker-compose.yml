version: '3.8'

services:
  vps-browser:
    image: lscr.io/linuxserver/chromium:latest
    container_name: vps-browser
    security_opt:
      - seccomp:unconfined # Required for Chromium sandboxing
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - CHROME_CLI=https://www.google.com/
      # Change CUSTOM_USER and PASSWORD for authentication
      - CUSTOM_USER=admin
      - PASSWORD=ChangeMeSecure123!
    volumes:
      - ./config:/config
    ports:
      # Port 3000 for HTTP (Web GUI / Browser stream)
      - "3000:3000"
      # Port 3001 for HTTPS (Self-signed SSL)
      - "3001:3001"
    shm_size: "2gb" # Chromium requires shared memory for smooth rendering
    restart: unless-stopped
